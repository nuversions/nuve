<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuve - Centro de Mando</title>
    <style>
        :root {
            --bg-color: #8ba3a7;       
            --text-main: #f3f0df;      
            --text-light: #f3f0df;     
            --accent-red: #c06048;     
            --accent-orange: #d97746;  
            --alert-red: #ff3b30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
        }

        /* AGENTE CENTINELA: Alerta de Seguridad */
        .sentinel-alert {
            position: absolute;
            top: -100px; /* Oculto por defecto */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 59, 48, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 0 0 15px 15px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(255, 59, 48, 0.3);
            z-index: 9999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sentinel-alert.active {
            top: 0; /* Aparece bajando desde el techo */
        }

        /* Etiqueta de Especialidad */
        .specialty-tag {
            position: absolute;
            top: 5%; left: 5%;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 8px 16px; border-radius: 20px;
            color: var(--text-light); font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 1px;
            z-index: 10; border: 1px solid rgba(255,255,255,0.2);
        }

        /* Contenedor Principal (Centro/Izquierda) */
        .main-container {
            position: absolute; top: 25%; left: 35%;
            display: flex; flex-direction: column; align-items: flex-start;
            z-index: 10; width: 380px;
        }

        .brand-title {
            font-size: 5rem; font-weight: 700; color: var(--text-main);
            letter-spacing: -2px; margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        /* Nube Minimalista de Friday */
        .friday-interaction-box {
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px; padding: 10px 20px; width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex; align-items: center; gap: 12px; transition: all 0.3s ease;
        }
        .friday-interaction-box:focus-within {
            background-color: rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.6); transform: translateY(-2px);
        }
        .friday-input {
            background: none; border: none; outline: none; color: var(--text-light); font-size: 1.1rem; width: 100%;
        }
        .friday-input::placeholder { color: rgba(243, 240, 223, 0.7); }

        .friday-submit-btn {
            background-color: var(--accent-orange); border: none; color: white; cursor: pointer;
            font-size: 1.2rem; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background-color 0.2s;
        }
        .friday-submit-btn:hover { transform: scale(1.1); background-color: var(--accent-red); }

        /* Panel de Asistencia al Usuario */
        .right-panel {
            position: absolute; right: 4%; top: 20%; width: 320px;
            display: flex; flex-direction: column; gap: 16px; z-index: 10;
        }

        .friday-assistant-panel {
            background-color: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px; padding: 20px;
            color: var(--text-light); box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-height: 400px; overflow-y: auto;
        }
        .assistant-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px;
        }
        .assistant-icon {
            background-color: var(--accent-orange); width: 12px; height: 12px; border-radius: 50%; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(217, 119, 70, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(217, 119, 70, 0); } 100% { box-shadow: 0 0 0 0 rgba(217, 119, 70, 0); } }
        .assistant-title { font-size: 1rem; font-weight: 600; }
        .assistant-message { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }

        /* Geometría Inferior */
        .landscape-background { position: absolute; bottom: 0; left: 0; width: 100%; height: 42vh; z-index: 1; }
        .geo-shape { position: absolute; bottom: 0; width: 100%; height: 100%; }
        .shape-left-orange { background-color: var(--accent-orange); clip-path: polygon(0 62%, 56% 30%, 56% 100%, 0% 100%); z-index: 3; }
        .shape-center-pillar { background-color: #a33820; clip-path: polygon(56% 30%, 59% 33%, 59% 100%, 56% 100%); z-index: 4; }
        .shape-right-top { background-color: var(--accent-red); clip-path: polygon(59% 33%, 72% 0%, 100% 45%, 59% 33%); z-index: 2; }
        .shape-right-shadow { background-color: #8b3c2a; clip-path: polygon(59% 33%, 100% 45%, 100% 100%, 59% 100%); z-index: 1; }
    </style>
</head>
<body>

    <div id="sentinelAlert" class="sentinel-alert">
        ⚠️ <span id="sentinelText">Anomalía detectada.</span>
    </div>

    <div class="specialty-tag">Generador Web Automático</div>

    <div class="main-container">
        <div class="brand-title">NUVE</div>
        
        <div class="friday-interaction-box">
            <input type="text" id="fridayInput" class="friday-input" placeholder="Pregúntale a Friday..." autocomplete="off">
            <button id="sendBtn" class="friday-submit-btn" title="Enviar a Friday">➔</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="friday-assistant-panel">
            <div class="assistant-header">
                <div class="assistant-icon" id="statusIcon"></div>
                <div class="assistant-title">Asistencia Friday</div>
            </div>
            <div class="assistant-message" id="fridayMessage">
                Sistemas en línea y Centinela activo. Dime qué tipo de página web quieres crear hoy.
            </div>
        </div>
    </div>

    <div class="landscape-background">
        <div class="geo-shape shape-left-orange"></div>
        <div class="geo-shape shape-center-pillar"></div>
        <div class="geo-shape shape-right-top"></div>
        <div class="geo-shape shape-right-shadow"></div>
    </div>

    <script>
        const input = document.getElementById('fridayInput');
        const button = document.getElementById('sendBtn');
        const messageDisplay = document.getElementById('fridayMessage');
        const statusIcon = document.getElementById('statusIcon');
        const sentinelAlert = document.getElementById('sentinelAlert');
        const sentinelText = document.getElementById('sentinelText');

        // INYECCIÓN CUÁNTICA PERMANENTE
        const apiKey = "AQ.Ab8RN6LK-Z2qahYHKlLYh21ll4BAD6IPARu5qcDQW2wCakVvZg";

        let conversationHistory = [
            {
                "role": "user",
                "parts": [{ "text": "Eres Friday, una asistente de inteligencia artificial amigable, paciente y experta en diseño web. Estás en la plataforma Nuve. Tu objetivo es ayudar al usuario a crear código HTML y CSS paso a paso. Saluda brevemente y asiste." }]
            },
            {
                "role": "model",
                "parts": [{ "text": "Entendido. Soy Friday. Operaré como experta en desarrollo web y guiaré al usuario." }]
            }
        ];

        // Función del Agente Centinela
        function dispararCentinela(mensaje) {
            sentinelText.innerText = mensaje;
            sentinelAlert.classList.add('active');
            statusIcon.style.backgroundColor = "red";
            messageDisplay.innerHTML = "<strong>Conexión bloqueada por Centinela.</strong> Revise la alerta superior.";
            
            // Auto-ocultar después de 8 segundos
            setTimeout(() => {
                sentinelAlert.classList.remove('active');
            }, 8000);
        }

        async function procesarComando() {
            const comando = input.value.trim();

            if (!comando) return;
            
            if (!apiKey || apiKey === "PEGUE_AQUI_SU_API_KEY_REAL_MANTENIENDO_LAS_COMILLAS") {
                dispararCentinela("Fallo de Inyección: La API Key no ha sido detectada en el código fuente.");
                return;
            }

            messageDisplay.innerHTML = "<em>Procesando señal cuántica...</em>";
            statusIcon.style.backgroundColor = "yellow";
            input.value = '';

            conversationHistory.push({ "role": "user", "parts": [{ "text": comando }] });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                // CENTINELA MONITOREANDO RESPUESTAS HTTP
                if (!response.ok) {
                    if (response.status === 400) throw new Error("Llave API Inválida o solicitud malformada.");
                    if (response.status === 403) throw new Error("Acceso denegado. Permisos insuficientes en la API Key.");
                    if (response.status === 429) throw new Error("Límite de cuota excedido. Mucho tráfico en el servidor.");
                    if (response.status >= 500) throw new Error("Error interno en los servidores de Google (Gemini).");
                    throw new Error("Anomalía desconocida en la red. Código: " + response.status);
                }

                const data = await response.json();
                const textResponse = data.candidates[0].content.parts[0].text;

                conversationHistory.push({ "role": "model", "parts": [{ "text": textResponse }] });

                messageDisplay.innerHTML = formatearRespuesta(textResponse);
                statusIcon.style.backgroundColor = "var(--accent-orange)"; 

            } catch (error) {
                // Activación de Centinela ante la falla
                dispararCentinela(`ALERTA DE SISTEMA: ${error.message}`);
                conversationHistory.pop(); // Limpiar el historial corrupto
            }
        }

            return texto
