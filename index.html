<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuve - Centro de Mando</title>
    <style>
        /* Paleta de colores extraída de la referencia */
        :root {
            --bg-color: #8ba3a7;       /* Azul-gris del fondo */
            --text-main: #bde09c;      /* Tono verde/crema del reloj original */
            --text-light: #f3f0df;     /* Crema claro */
            --accent-red: #c06048;     /* Terracota/Rojo del edificio */
            --accent-cream: #d3beaa;   /* Crema de la estructura */
            --accent-shadow: #a27a64;  /* Sombra/Marrón de la estructura */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
        }

        /* Área Principal Izquierda / Centro */
        .main-container {
            position: absolute;
            top: 22%;
            left: 35%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 10;
            width: 320px;
        }

        .brand-title {
            font-size: 4.5rem;
            font-weight: 400;
            color: var(--text-main);
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 15px;
        }

        /* Cuadro de texto interactivo para Friday */
        .friday-interaction-box {
            background-color: rgba(243, 240, 239, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 6px 12px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .friday-input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-light);
            font-size: 1.05rem;
            width: 100%;
            font-family: inherit;
        }

        .friday-input::placeholder {
            color: var(--text-light);
            opacity: 0.8;
        }

        .friday-submit-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .friday-submit-btn:hover {
            transform: scale(1.1);
        }

        /* Panel Lateral Derecho */
        .right-panel {
            position: absolute;
            right: 4%;
            top: 10%;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 10;
            align-items: flex-end;
        }

        .widget {
            background-color: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            color: var(--text-light);
        }

        .widget-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
            margin-bottom: 8px;
        }

        /* Estructura Geométrica Inferior */
        .landscape-background {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 42vh;
            z-index: 1;
        }

        .geo-shape {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* Bloque Izquierdo Rojo */
        .shape-left-red {
            background-color: var(--accent-red);
            clip-path: polygon(0 62%, 56% 30%, 56% 100%, 0% 100%);
            z-index: 3;
        }

        /* Columna de transición central */
        .shape-center-pillar {
            background-color: #aa4e37;
            clip-path: polygon(56% 30%, 59% 33%, 59% 100%, 56% 100%);
            z-index: 4;
        }

        /* Bloque Superior Crema */
        .shape-right-top {
            background-color: var(--accent-cream);
            clip-path: polygon(59% 33%, 72% 0%, 100% 45%, 59% 33%);
            z-index: 2;
        }

        /* Bloque Derecho Sombra */
        .shape-right-shadow {
            background-color: var(--accent-shadow);
            clip-path: polygon(59% 33%, 100% 45%, 100% 100%, 59% 100%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="brand-title">NUVE</div>
        
        <div class="friday-interaction-box">
            <input type="text" id="fridayInput" class="friday-input" placeholder="Pregúntale a Friday..." autocomplete="off">
            <button id="sendBtn" class="friday-submit-btn" title="Enviar comando">➔</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="widget">
            <div class="widget-title">Core Engine</div>
            <div>Nuversions Labs v1.1</div>
        </div>
        <div class="widget">
            <div class="widget-title">Especialidad</div>
            <div>Generador Web Automático</div>
        </div>
        <div class="widget">
            <div class="widget-title">Consola JSON</div>
            <div id="jsonStatus" style="font-family: monospace; font-size: 0.85rem; color: var(--text-main);">{ "status": "ready" }</div>
        </div>
    </div>

    <div class="landscape-background">
        <div class="geo-shape shape-left-red"></div>
        <div class="geo-shape shape-center-pillar"></div>
        <div class="geo-shape shape-right-top"></div>
        <div class="geo-shape shape-right-shadow"></div>
    </div>

    <script>
        const input = document.getElementById('fridayInput');
        const button = document.getElementById('sendBtn');
        const jsonStatus = document.getElementById('jsonStatus');

        function procesarComando() {
            const comando = input.value.trim();
            if (comando) {
                // Simulación de estructuración JSON del asistente de negocios
                const dataPayload = {
                    agente: "Friday Core",
                    solicitud: comando,
                    timestamp: new Date().toLocaleTimeString()
                };
                
                // Muestra la respuesta estructurada en el widget derecho
                jsonStatus.textContent = JSON.stringify(dataPayload, null, 2);
                
                // Limpia el campo
                input.value = '';
            }
        }

        button.addEventListener('click', procesarComando);
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                procesarComando();
            }
        });
    </script>

</body>
</html>
