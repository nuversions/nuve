<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuve - Centro de Mando</title>
    <style>
        :root {
            --bg-color: #8ba3a7;       
            --text-main: #f3f0df;      
            --text-light: #f3f0df;     
            --accent-red: #c06048;     
            --accent-orange: #d97746;  
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
        }

        /* Etiqueta de Especialidad */
        .specialty-tag {
            position: absolute;
            top: 5%;
            left: 5%;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--text-light);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Contenedor Principal (Centro/Izquierda) */
        .main-container {
            position: absolute;
            top: 25%;
            left: 35%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 10;
            width: 380px;
        }

        .brand-title {
            font-size: 5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -2px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        /* Nube Minimalista de Friday */
        .friday-interaction-box {
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px; 
            padding: 10px 20px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .friday-interaction-box:focus-within {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .friday-input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-light);
            font-size: 1.1rem;
            width: 100%;
        }

        .friday-input::placeholder { color: rgba(243, 240, 223, 0.7); }

        .friday-submit-btn {
            background-color: var(--accent-orange);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }

        .friday-submit-btn:hover {
            transform: scale(1.1);
            background-color: var(--accent-red);
        }

        /* Panel de Asistencia al Usuario */
        .right-panel {
            position: absolute;
            right: 4%;
            top: 20%;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }

        .apiKey-box {
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .apiKey-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            color: white;
            padding: 6px;
            font-size: 0.8rem;
        }
        
        .apiKey-input::placeholder { color: rgba(255,255,255,0.5); }

        .friday-assistant-panel {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            color: var(--text-light);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-height: 400px;
            overflow-y: auto;
        }

        .assistant-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .assistant-icon {
            background-color: var(--accent-orange);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(217, 119, 70, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(217, 119, 70, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 119, 70, 0); }
        }

        .assistant-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .assistant-message {
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap; /* Mantiene saltos de línea de la IA */
        }

        /* Geometría Inferior */
        .landscape-background {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 42vh; z-index: 1;
        }
        .geo-shape { position: absolute; bottom: 0; width: 100%; height: 100%; }
        .shape-left-orange { background-color: var(--accent-orange); clip-path: polygon(0 62%, 56% 30%, 56% 100%, 0% 100%); z-index: 3; }
        .shape-center-pillar { background-color: #a33820; clip-path: polygon(56% 30%, 59% 33%, 59% 100%, 56% 100%); z-index: 4; }
        .shape-right-top { background-color: var(--accent-red); clip-path: polygon(59% 33%, 72% 0%, 100% 45%, 59% 33%); z-index: 2; }
        .shape-right-shadow { background-color: #8b3c2a; clip-path: polygon(59% 33%, 100% 45%, 100% 100%, 59% 100%); z-index: 1; }
    </style>
</head>

    </div>

### ¿Qué hace esta actualización?
1. **La Ranura del Enlace (API Key):** En el panel derecho de Asistencia, verá un campo oscuro. Ahí debe pegar la llave que obtiene de Google AI Studio. Como no se guarda en el código, Optimus Prime aprueba esta medida de ciberseguridad. Nadie podrá robarle su cuota de uso.
2. **Memoria de Conversación:** La lógica de JavaScript ahora incluye un `conversationHistory`. Friday recordará lo que hablaron hace dos mensajes, permitiéndole construir la web paso a paso de forma coherente.
3. **Generador de Código Real:** Cuando Friday devuelva código HTML o CSS, la función `formatearRespuesta` lo detectará y lo pondrá dentro de un bonito recuadro oscuro para que usted pueda copiarlo fácilmente.

Pegue esto en su repositorio, guarde, ponga su API Key en la pantalla pública de Nuve, ¡y empiece a pedirle páginas web reales a Friday!
