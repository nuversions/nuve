<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuve - Centro de Mando</title>
    <style>
        /* Paleta de colores extraída de la referencia */
        :root {
            --bg-color: #8ba3a7;       /* Azul-gris del fondo */
            --text-main: #bde09c;      /* Tono verde/crema del reloj */
            --text-light: #f3f0df;     /* Crema claro */
            --accent-red: #c06048;     /* Terracota/Rojo del edificio */
            --accent-cream: #d3beaa;   /* Crema de la estructura */
            --accent-shadow: #a27a64;  /* Sombra/Marrón de la estructura */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
        }

        /* Área Principal Izquierda / Centro */
        .main-container {
            position: absolute;
            top: 22%;
            left: 35%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 10;
        }

        .brand-title {
            font-size: 4.5rem;
            font-weight: 400;
            color: var(--text-main);
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 12px;
        }

        .friday-input-box {
            background-color: rgba(243, 240, 239, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px 24px;
            min-width: 260px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .friday-text {
            color: var(--text-light);
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Panel Lateral Derecho */
        .right-panel {
            position: absolute;
            right: 4%;
            top: 10%;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 10;
            align-items: flex-end;
        }

        .widget {
            background-color: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            color: var(--text-light);
        }

        .widget-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
            margin-bottom: 8px;
        }

        /* Estructura Geométrica Inferior */
        .landscape-background {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 42vh;
            z-index: 1;
        }

        .geo-shape {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* Bloque Izquierdo Rojo */
        .shape-left-red {
            background-color: var(--accent-red);
            clip-path: polygon(0 62%, 56% 30%, 56% 100%, 0% 100%);
            z-index: 3;
        }

        /* Columna de transición central */
        .shape-center-pillar {
            background-color: #aa4e37;
            clip-path: polygon(56% 30%, 59% 33%, 59% 100%, 56% 100%);
            z-index: 4;
        }

        /* Bloque Superior Crema */
        .shape-right-top {
            background-color: var(--accent-cream);
            clip-path: polygon(59% 33%, 72% 0%, 100% 45%, 59% 33%);
            z-index: 2;
        }

        /* Bloque Derecho Sombra */
        .shape-right-shadow {
            background-color: var(--accent-shadow);
            clip-path: polygon(59% 33%, 100% 45%, 100% 100%, 59% 100%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="brand-title">NUVE</div>
        <div class="friday-input-box">
            <span class="friday-text">Pregúntale a Friday</span>
        </div>
    </div>

    <div class="right-panel">
        <div class="widget">
            <div class="widget-title">Sistema</div>
            <div>Nuversions Labs v1.0</div>
        </div>
        <div class="widget">
            <div class="widget-title">Conexiones</div>
            <div>Servidor Activo</div>
        </div>
    </div>

    <div class="landscape-background">
        <div class="geo-shape shape-left-red"></div>
        <div class="geo-shape shape-center-pillar"></div>
        <div class="geo-shape shape-right-top"></div>
        <div class="geo-shape shape-right-shadow"></div>
    </div>

</body>
</html>
