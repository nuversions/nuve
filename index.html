<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuve - Generador Web Automático</title>
    <style>
        :root {
            --bg-color: #8ba3a7;       
            --text-main: #f3f0df;      
            --text-light: #f3f0df;     
            --accent-red: #c06048;     
            --accent-orange: #d97746;  
            --panel-bg: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            height: 100vh; width: 100vw; overflow: hidden; position: relative; display: flex;
        }

        /* Modal Bóveda de API */
        .api-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 10000;
        }
        .api-modal.hidden { display: none; }
        .api-box {
            background: var(--bg-color); border: 2px solid var(--accent-orange);
            padding: 30px; border-radius: 20px; width: 450px; text-align: center; color: white;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        .api-input {
            width: 100%; padding: 12px; margin: 20px 0; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3); outline: none; background: rgba(0,0,0,0.3); color: white; font-family: monospace;
        }
        .api-btn {
            background: var(--accent-orange); color: white; border: none;
            padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s;
        }
        .api-btn:hover { background: var(--accent-red); }

        /* Status Bar Superior */
        .status-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 40px;
            background: rgba(0,0,0,0.2); display: flex; align-items: center; padding: 0 20px;
            color: var(--text-light); font-size: 0.8rem; z-index: 50;
            justify-content: space-between;
        }
        .status-indicators { display: flex; gap: 15px; }
        .indicator { display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; transition: all 0.3s ease; }
        .dot.active { background: #27c93f; box-shadow: 0 0 8px #27c93f; }
        .dot.error { background: #ff5f56; box-shadow: 0 0 8px #ff5f56; }
        .dot.thinking { background: #38bdf8; box-shadow: 0 0 10px #38bdf8; } /* Nuevo estado Azul */

        /* Panel Izquierdo: Interacción */
        .main-container {
            position: absolute; top: 15%; left: 5%; display: flex; flex-direction: column;
            align-items: flex-start; z-index: 10; width: 35%;
        }
        .brand-title { font-size: 4rem; font-weight: 700; color: var(--text-main); margin-bottom: 15px; text-shadow: 2px 2px 10px rgba(0,0,0,0.1); }

        .friday-interaction-box {
            background-color: rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 30px;
            padding: 10px 20px; width: 100%; display: flex; align-items: center; gap: 12px; margin-bottom: 15px;
        }
        .friday-input { background: none; border: none; outline: none; color: var(--text-light); font-size: 1.1rem; width: 100%; }
        .friday-input::placeholder { color: rgba(243, 240, 223, 0.7); }
        .friday-submit-btn {
            background-color: var(--accent-orange); border: none; color: white; cursor: pointer;
            width: 40px; height: 40px; border-radius: 50%; transition: transform 0.2s; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
        }
        .friday-submit-btn:hover { transform: scale(1.1); background-color: var(--accent-red); }

        .friday-assistant-panel {
            background-color: var(--panel-bg); backdrop-filter: blur(8px);
            border-radius: 16px; padding: 20px; color: var(--text-light); width: 100%;
            height: 45vh; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 90%; line-height: 1.4; font-size: 0.95rem; }
        .msg-friday { background: rgba(0,0,0,0.2); align-self: flex-start; border-top-left-radius: 0; }
        .msg-user { background: var(--accent-orange); align-self: flex-end; border-top-right-radius: 0; }
        .msg-system { background: rgba(255, 59, 48, 0.8); align-self: center; text-align: center; width: 100%; font-weight: bold;}

        /* Panel Derecho: Lienzo (Archie) */
        .preview-panel {
            position: absolute; right: 5%; top: 10%; width: 50%; height: 80%;
            background: #ffffff; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow: hidden; display: flex; flex-direction: column; z-index: 20;
            border: 4px solid var(--accent-cream);
        }
        .preview-header {
            background: #e0e0e0; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between;
            color: #333; font-weight: bold; font-size: 0.9rem;
        }
        .window-controls { display: flex; gap: 8px;}
        .window-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff5f56; }
        .window-dot:nth-child(2) { background: #ffbd2e; }
        .window-dot:nth-child(3) { background: #27c93f; }
        
        iframe { flex-grow: 1; border: none; width: 100%; height: 100%; background: white; }

        /* Geometría de Fondo */
        .landscape-background { position: absolute; bottom: 0; left: 0; width: 100%; height: 42vh; z-index: 1; }
        .geo-shape { position: absolute; bottom: 0; width: 100%; height: 100%; }
        .shape-left-orange { background-color: var(--accent-orange); clip-path: polygon(0 62%, 56% 30%, 56% 100%, 0% 100%); z-index: 3; }
        .shape-center-pillar { background-color: #a33820; clip-path: polygon(56% 30%, 59% 33%, 59% 100%, 56% 100%); z-index: 4; }
        .shape-right-top { background-color: var(--accent-red); clip-path: polygon(59% 33%, 72% 0%, 100% 45%, 59% 33%); z-index: 2; }
        .shape-right-shadow { background-color: #8b3c2a; clip-path: polygon(59% 33%, 100% 45%, 100% 100%, 59% 100%); z-index: 1; }
    </style>
</head>
<body>

    <!-- Barra de Estado de Agentes -->
    <div class="status-bar">
        <div>NUVE CORE OS v3.1</div>
        <div class="status-indicators">
            <div class="indicator">Optimus (Sec) <div class="dot active" id="dot-optimus"></div></div>
            <div class="indicator">Friday (IA) <div class="dot" id="dot-friday"></div></div>
            <div class="indicator">Archie (Render) <div class="dot active" id="dot-archie"></div></div>
        </div>
    </div>

    <!-- Bóveda API Key -->
    <div id="apiModal" class="api-modal hidden">
        <div class="api-box">
            <h2>🔑 PROTOCOLO OMEGA</h2>
            <p style="font-size: 0.9rem; margin-top: 10px; color: #ccc;">Sistemas bloqueados. Se requiere API Key de Gemini para activar la red neuronal de Friday.</p>
            <input type="password" id="apiInputBox" class="api-input" placeholder="Pegue aquí su API Key (AIzaSy...)">
            <button class="api-btn" onclick="guardarLlave()">Desbloquear Sistema</button>
            <button class="api-btn" style="background: transparent; border: 1px solid #ccc; margin-top:10px;" onclick="cerrarModalSinLlave()">Continuar Offline</button>
        </div>
    </div>

    <!-- Panel Izquierdo -->
    <div class="main-container">
        <div class="brand-title">NUVE</div>
        
        <div class="friday-interaction-box">
            <input type="text" id="fridayInput" class="friday-input" placeholder="Dime qué página web quieres construir..." autocomplete="off">
            <button id="sendBtn" class="friday-submit-btn">➔</button>
        </div>

        <div class="friday-assistant-panel" id="chatArea">
            <div class="msg msg-friday"><strong>Friday:</strong> Sistema iniciado. A la espera de directrices de construcción.</div>
        </div>
    </div>

    <!-- Panel Derecho (Archie) -->
    <div class="preview-panel">
        <div class="preview-header">
            <div class="window-controls">
                <div class="window-dot"></div><div class="window-dot"></div><div class="window-dot"></div>
            </div>
            <span>LIENZO DE ARCHIE - RENDER EN VIVO</span>
        </div>
        <iframe id="webPreview" srcdoc="<body style='font-family:sans-serif; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#f0f0f0; color:#888; margin:0;'><div style='font-size:3rem; margin-bottom:10px;'>⚡</div><div>Archie Standby. Esperando código de Friday.</div></body>"></iframe>
    </div>

    <div class="landscape-background">
        <div class="geo-shape shape-left-orange"></div>
        <div class="geo-shape shape-center-pillar"></div>
        <div class="geo-shape shape-right-top"></div>
        <div class="geo-shape shape-right-shadow"></div>
    </div>

    <script>
        // CORE LOGIC V3.1
        const input = document.getElementById('fridayInput');
        const button = document.getElementById('sendBtn');
        const chatArea = document.getElementById('chatArea');
        const webPreview = document.getElementById('webPreview');
        const apiModal = document.getElementById('apiModal');
        
        // Indicadores
        const dotFriday = document.getElementById('dot-friday');

        // GESTIÓN DE LLAVE
        let apiKey = localStorage.getItem('nuve_gemini_key');

        if (!apiKey) {
            apiModal.classList.remove('hidden');
        } else {
            dotFriday.classList.add('active'); // Friday está lista si hay llave
        }

        function guardarLlave() {
            const tempKey = document.getElementById('apiInputBox').value.trim();
            if(tempKey.startsWith('AIza') && tempKey.length > 30) {
                localStorage.setItem('nuve_gemini_key', tempKey);
                apiKey = tempKey;
                apiModal.classList.add('hidden');
                dotFriday.classList.add('active');
                agregarMensaje("Friday", "Enlace cuántico establecido. Soy toda oídos, Jefe.", 'msg-friday');
            } else {
                alert("La llave parece inválida. Asegúrese de que empiece con 'AIza'.");
            }
        }

        function cerrarModalSinLlave() {
            apiModal.classList.add('hidden');
            agregarMensaje("Sistema", "ADVERTENCIA: Operando en modo Offline. Friday no generará código.", 'msg-system');
        }

        // Historial Base Estricto
        let conversationHistory = [{
            "role": "user",
            "parts": [{ "text": "Eres Friday, una IA experta en desarrollo web Frontend (HTML/CSS). Tu objetivo es programar páginas web completas en un solo archivo a petición del usuario. REGLA ABSOLUTA: Tu respuesta DEBE contener un bloque de código markdown ` ```html ... ``` ` con el código completo y funcional. Usa estilos CSS modernos y atractivos (puedes usar CSS grid, flexbox, gradientes). Nunca expliques el código, solo entrega una breve confirmación y luego el bloque de código HTML." }]
        }];

        function agregarMensaje(emisor, texto, claseCss) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${claseCss}`;
            msgDiv.innerHTML = `<strong>${emisor}:</strong> ${texto}`;
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function procesarComando() {
            const comando = input.value.trim();
            if (!comando) return;

            if (!apiKey) {
                apiModal.classList.remove('hidden');
                return;
            }

            // Flujo normal
            agregarMensaje("Tú", comando, 'msg-user');
            input.value = '';
            
            // Indicador de carga
            const loadMsgId = 'load-' + Date.now();
            agregarMensaje("Friday", "<em>Analizando directrices y programando en azul...</em>", 'msg-friday');
            chatArea.lastChild.id = loadMsgId; 
            
            // Efecto visual AZUL en la barra superior (Friday Pensando)
            dotFriday.classList.remove('active');
            dotFriday.classList.add('thinking');

            conversationHistory.push({ "role": "user", "parts": [{ "text": comando }] });

            try {
                // Usando Gemini 1.5 Flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Error en la conexión con el servidor de Google.");
                }

                const data = await response.json();
                
                if (!data.candidates || data.candidates.length === 0) {
                    throw new Error("La IA no devolvió una respuesta válida.");
                }

                const textResponse = data.candidates[0].content.parts[0].text;
                
                conversationHistory.push({ "role": "model", "parts": [{ "text": textResponse }] });
                
                const loadMsgElem = document.getElementById(loadMsgId);
                if (loadMsgElem) loadMsgElem.remove();

                // EXTRAER EL CÓDIGO HTML (ARCHIE EN ACCIÓN)
                const match = textResponse.match(/```html([\s\S]*?)```/i);
                
                if (match && match[1]) {
                    const htmlCode = match[1].trim();
                    webPreview.srcdoc = htmlCode;
                    
                    const cleanResponse = textResponse.replace(/```html[\s\S]*?```/i, '').trim();
                    agregarMensaje("Friday", cleanResponse || "Código generado y renderizado con éxito por Archie.", 'msg-friday');
                } else {
                    agregarMensaje("Friday", textResponse, 'msg-friday');
                    agregarMensaje("Sistema", "Aviso: Friday no incluyó un bloque HTML válido para renderizar.", 'msg-system');
                }

            } catch (error) {
                const loadMsgElem = document.getElementById(loadMsgId);
                if (loadMsgElem) loadMsgElem.remove();
                
                agregarMensaje("Sistema (Optimus)", `FALLO DE CONEXIÓN: ${error.message}`, 'msg-system');
                dotFriday.classList.remove('thinking');
                dotFriday.classList.add('error');
                
                conversationHistory.pop();
            } finally {
                // Restaurar indicador verde si no hay error
                if(!dotFriday.classList.contains('error')){
                    dotFriday.classList.remove('thinking');
                    dotFriday.classList.add('active');
                }
            }
        }

        button.addEventListener('click', procesarComando);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') procesarComando(); });

        document.querySelector('.brand-title').addEventListener('dblclick', () => {
            localStorage.removeItem('nuve_gemini_key');
            apiKey = null;
            dotFriday.classList.remove('active', 'thinking', 'error');
            apiModal.classList.remove('hidden');
        });
    </script>
</body>
</html>
